<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Metta · Manual de Marca</title>
<link rel="stylesheet" href="../../../brand/colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">
<style>
  html,body{margin:0;background:#0C161B;color:#fff}
  .ms{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const App = () => (
  <div>
    <Header tone="dark" />

    {/* COVER */}
    <section style={{
      minHeight: 720, background: C.dark, color: C.white,
      padding: '140px 8% 10%',
      display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
    }}>
      <div style={{
        fontWeight: 540, fontStretch: '132%', fontSize: 13,
        letterSpacing: '0.18em', textTransform: 'uppercase',
        color: C.yellow, marginBottom: 32,
      }}>Manual de Marca · v1.0</div>
      <h1 style={{
        fontWeight: 870, fontStretch: '132%',
        fontSize: 'clamp(64px, 9vw, 140px)', lineHeight: 0.88,
        letterSpacing: '-0.02em', margin: 0,
      }}>
        <span style={{ color: C.yellow }}>A marca</span><br/>
        como método.
      </h1>
      <p style={{
        fontWeight: 400, fontSize: 22, lineHeight: 1.55,
        color: C.muted, maxWidth: 620, marginTop: 36, marginBottom: 0,
      }}>
        Um sistema visual coerente é o primeiro sinal público de que um negócio opera com método.
        Este manual traduz a estratégia da Metta em decisões técnicas reprodutíveis.
      </p>
      <div style={{ height: 1, background: 'rgba(255,255,255,0.12)', width: 120, margin: '56px 0 32px' }}/>
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
        <CTAPill variant="primary">Baixar Brand Kit</CTAPill>
        <CTAPill variant="ghost">Ver aplicações</CTAPill>
      </div>
    </section>

    <YellowBand thick>Inteligência Comercial · Método · Previsibilidade · Garantia</YellowBand>

    {/* 01 · POSICIONAMENTO */}
    <SectionOpener
      tone="light"
      num="01"
      kicker="Capítulo 01 · Posicionamento"
      title="Quem é a Metta."
      lede="Ecossistema de inteligência comercial. Posicionamento direto: a Metta ensina empresas a bater meta com previsibilidade — método, ciência aplicada e garantia contratual. A identidade visual precisa carregar esse peso em silêncio."
    />

    <StrategyTechRow
      tone="light"
      kicker="Estratégia · Voz"
      title="Direta, fundadora, anti-palestra."
      body="A comunicação da Metta rejeita linguagem motivacional genérica. Cada peça soa como alguém que já implementou — não como quem só sugere. Isso se traduz tecnicamente em títulos curtos, sem adjetivos, em alto contraste."
      spec={
        <div>
          <SpecRow label="Tom" value="Declarativo" />
          <SpecRow label="Pessoa" value="1ª pessoa (nós)" />
          <SpecRow label="Voz" value="Ativa" />
          <SpecRow label="Comprimento de headline" value="≤ 7 palavras" />
          <SpecRow label="Uso de adjetivos" value="Mínimo" />
          <SpecRow label="Emoji" value="Proibido" />
        </div>
      }
    />

    <QuoteBlock tone="light" cite="POSICIONAMENTO · METTA">
      A marca fala pouco. Quando fala, é para afirmar — não para convencer.
    </QuoteBlock>

    {/* 02 · COR */}
    <SectionOpener
      tone="dark"
      num="02"
      kicker="Capítulo 02 · Cor"
      title="Amarelo como ação. Preto como contexto."
      lede="Duas cores carregam a marca. O Amarelo Metta marca o que é decisão, corte, convicção. O Azul Noite é o fundo editorial onde a decisão respira. O branco gelo e o gelo azulado são neutros estruturais — cinza puro está fora do sistema."
    />

    <StrategyTechRow
      tone="dark"
      kicker="Estratégia · Paleta"
      title="Cada cor tem função, não decoração."
      body="Amarelo nunca é fundo esmaecido — é sempre cheio. O azul acinzentado existe só como texto de suporte. Cinzas neutros foram removidos do sistema porque diluem a hierarquia entre contexto e ação."
      spec={
        <div>
          <ColorSwatch hex="#FFBE18" name="Amarelo Metta · Ação" onDark />
          <ColorSwatch hex="#0C161B" name="Azul Noite · Contexto" onDark />
          <ColorSwatch hex="#FAFCFD" name="Branco Gelo · Base clara" onDark />
          <ColorSwatch hex="#EBF3F7" name="Gelo Azulado · Superfície" onDark />
          <ColorSwatch hex="#435965" name="Azul Acinzentado · Suporte" onDark />
        </div>
      }
    />

    <StrategyTechRow
      tone="dark"
      kicker="Aplicação · Contraste"
      title="Regra de aderência de cor."
      body="A borda de um componente sempre herda a cor do texto. Se o texto é branco, a borda é branca. Se o texto é amarelo, a borda é amarela. Essa regra impede composições cinzas-no-cinza e mantém a leitura editorial em qualquer meio."
      spec={
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <CTAPill variant="primary">Primary · amarelo cheio</CTAPill>
          <CTAPill variant="dark">Dark · borda amarela</CTAPill>
          <CTAPill variant="ghost">Ghost · borda branca</CTAPill>
          <div style={{
            fontSize: 12, color: C.muted, marginTop: 8,
            borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: 12,
          }}>Regra: <strong style={{ color: C.white }}>cor do texto = cor da borda</strong>.</div>
        </div>
      }
    />

    {/* 03 · TIPOGRAFIA */}
    <SectionOpener
      tone="yellow"
      num="03"
      kicker="Capítulo 03 · Tipografia"
      title="Uma fonte. Quatro registros."
      lede="SF Pro é a única família da marca, usada em Expanded 132% para o registro display e em Regular 100% para corpo. A amplitude vem dos pesos — de Light 270 a Heavy 870 — não de famílias auxiliares."
    />

    <StrategyTechRow
      tone="light"
      kicker="Estratégia · Hierarquia"
      title="Escala, não estilo."
      body="Títulos e headlines em Heavy 870 Expanded ficam em caixa baixa — a força vem do peso e da largura, não da capitalização. Caixa alta é reservada a labels curtos (kickers, tags) com tracking alto. Itálico só em citações, Light 300."
      spec={
        <div>
          <SpecRow label="Família" value="SF Pro (Variable)" />
          <SpecRow label="Display stretch" value="132% (Expanded)" mono />
          <SpecRow label="Body stretch" value="100% (Regular)" mono />
          <SpecRow label="Heavy 870" value="Headlines · caixa baixa" />
          <SpecRow label="Semibold 650" value="Subtítulos editoriais" />
          <SpecRow label="Regular 410" value="Corpo · leituras longas" />
          <SpecRow label="Light 270" value="Citações, lede" />
        </div>
      }
    />

    <QuoteBlock tone="light" cite="TIPOGRAFIA · METTA">
      O peso expressa convicção. A largura expressa presença. A caixa expressa temperatura.
    </QuoteBlock>

    {/* 04 · MARCA */}
    <SectionOpener
      tone="dark"
      num="04"
      kicker="Capítulo 04 · Marca gráfica"
      title="Logotipo, símbolo e assinatura."
      lede="Três ativos com funções distintas. O logotipo horizontal para cabeçalhos e documentos. O símbolo isolado para usos em espaço reduzido — favicon, avatar, carimbo. A assinatura para fechamentos institucionais."
    />

    <StrategyTechRow
      tone="dark"
      kicker="Regras de uso"
      title="O símbolo não é um ícone."
      body="O símbolo circular é marca, não elemento de interface. Ele aparece com respiro total — nunca como textura de fundo em artes editoriais, nunca recortado ou com opacidade baixa sobre conteúdo. Para uso decorativo, use apenas em peças institucionais isoladas."
      spec={
        <div style={{ display: 'flex', gap: 20, alignItems: 'center', justifyContent: 'space-around' }}>
          <div style={{ textAlign: 'center' }}>
            <img src="../../../brand/assets/symbols/simbolo_metta_amarelo.svg" alt=""
              style={{ height: 84, marginBottom: 12 }} />
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: C.supportSoft }}>Símbolo · amarelo</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{
              background: C.yellow, borderRadius: 12, padding: 14, marginBottom: 12,
              display: 'inline-block',
            }}>
              <img src="../../../brand/assets/symbols/simbolo_metta_azul.svg" alt=""
                style={{ height: 56, display: 'block' }} />
            </div>
            <div style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: C.supportSoft }}>Sobre amarelo</div>
          </div>
        </div>
      }
    />

    {/* 05 · ICONOGRAFIA */}
    <SectionOpener
      tone="light"
      num="05"
      kicker="Capítulo 05 · Iconografia"
      title="Material Symbols, sem exceções."
      lede="A marca adota Material Symbols (Google) na variante Rounded como único sistema de ícones. A decisão evita inconsistências de traço entre peças e libera o símbolo da Metta da função decorativa."
    />

    <StrategyTechRow
      tone="light"
      kicker="Especificação"
      title="Um peso. Um container."
      body="Weight 500, tamanho ótico 24, FILL 0. Container padrão 56×56, radius 14, com três combinações de cor: amarelo sobre dark, dark sobre amarelo, dark sobre gelo azulado."
      spec={
        <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
          {[
            { bg: C.dark, fg: C.yellow, ic: 'rocket_launch' },
            { bg: C.yellow, fg: C.dark, ic: 'insights' },
            { bg: C.white, fg: C.dark, ic: 'verified', border: `1px solid rgba(12,22,27,0.1)` },
            { bg: C.iceBlue, fg: C.dark, ic: 'target' },
            { bg: C.support, fg: C.yellow, ic: 'auto_graph' },
            { bg: C.yellow, fg: C.dark, ic: 'arrow_forward' },
          ].map((g, i) => (
            <div key={i} style={{
              width: 56, height: 56, borderRadius: 14,
              background: g.bg, color: g.fg, border: g.border || 'none',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <span className="ms" style={{ fontSize: 28 }}>{g.ic}</span>
            </div>
          ))}
        </div>
      }
    />

    <TransitionBand tone="yellow" label="Próximo capítulo · Aplicações em peças editoriais e ads" num="06 →" />

    <Footer />
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
