<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:2px}
  .cell{aspect-ratio:1/.42;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}
  .cell img{max-width:80%;max-height:70%;display:block}
  .cell .tag{position:absolute;top:8px;left:12px;font-weight:540;font-stretch:132%;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .dark{background:#0C161B;color:#fff}
  .white{background:#FFFFFF}
  .yellow{background:#FFBE18;color:#0C161B}
  .ice{background:#EBF3F7}
</style></head>
<body>
<div class="wrap">
  <div class="cell dark"><span class="tag">ASSINATURA · DARK</span><img src="../assets/signatures/assinatura_metta_branco.svg" alt=""></div>
  <div class="cell white"><span class="tag">ASSINATURA · LIGHT</span><img src="../assets/signatures/assinatura_metta_azul.svg" alt=""></div>
  <div class="cell yellow"><span class="tag">ON YELLOW</span><img src="../assets/signatures/assinatura_metta_azul.svg" alt=""></div>
  <div class="cell ice"><span class="tag">AMARELO · ON DARK</span style="background:#0C161B"><img src="../assets/signatures/assinatura_metta_amarelo.svg" alt=""></div>
</div>
</body></html>
