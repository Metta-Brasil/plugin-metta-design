<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .card{padding:28px 24px;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;gap:18px;align-items:center;justify-content:space-around}
  .spec{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:96px;height:64px;background:#fff;border-radius:16px}
  .lb{font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#435965}
  .val{font-size:10px;color:#688594;font-variant-numeric:tabular-nums;max-width:130px;text-align:center}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="card">
  <div class="title">Elevação · shadows & glow</div>
  <div class="row">
    <div class="spec"><div class="box" style="box-shadow:0 1px 2px rgba(12,22,27,.06)"></div><span class="lb">sm</span><span class="val">0 1 2 · 6%</span></div>
    <div class="spec"><div class="box" style="box-shadow:0 8px 24px rgba(12,22,27,.08)"></div><span class="lb">md</span><span class="val">0 8 24 · 8%</span></div>
    <div class="spec"><div class="box" style="box-shadow:0 24px 48px rgba(12,22,27,.12)"></div><span class="lb">lg</span><span class="val">0 24 48 · 12%</span></div>
    <div class="spec"><div class="box" style="background:#0C161B;box-shadow:0 0 72px rgba(255,190,24,.25)"></div><span class="lb">glow · amarelo</span><span class="val">ambient only · nunca no logo</span></div>
  </div>
</div>
</body></html>
