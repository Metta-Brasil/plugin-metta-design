<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .wrap{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .q{padding:16px 0;max-width:560px}
  .q p{margin:0;font-weight:270;font-stretch:100%;font-style:italic;font-size:17px;line-height:1.5;color:#0C161B}
  .q cite{font-style:normal;display:block;margin-top:10px;font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#688594}
  .q-dark{background:#0C161B;color:#fff;padding:16px 22px;border-radius:12px}
  .q-dark p{color:#fff}
  .q-dark cite{color:#FFBE18}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="wrap">
  <div class="title">Quote blocks</div>
  <div class="q"><p>O mercado de gestão comercial no Brasil vai mudar — com quem tem coragem de fazer diferente.</p><cite>TIAGO ALVES, FUNDADOR</cite></div>
  <div class="q q-dark"><p>Método substitui improviso. Ciência substitui achismo.</p><cite>PLAYBOOK METTA</cite></div>
</div>
</body></html>
