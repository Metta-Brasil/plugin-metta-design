<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .cell{aspect-ratio:1.5/1;background-size:cover;background-position:center;position:relative}
  .cell .tag{position:absolute;top:10px;left:12px;font-weight:540;font-stretch:132%;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .dk .tag{color:#0C161B;text-shadow:none}
</style></head>
<body>
<div class="wrap">
  <div class="cell dk" style="background-image:url('../assets/backgrounds/bg_gradiente_amarelo_1.jpg')"><span class="tag">GRAD · AMARELO</span></div>
  <div class="cell" style="background-image:url('../assets/backgrounds/bg_gradiente_escuro_1.jpg')"><span class="tag">GRAD · ESCURO</span></div>
  <div class="cell" style="background-image:url('../assets/backgrounds/bg_liso_azul_1.jpg')"><span class="tag">LISO · AZUL</span></div>
  <div class="cell dk" style="background-image:url('../assets/backgrounds/bg_liso_amarelo_1.jpg')"><span class="tag">LISO · AMARELO</span></div>
  <div class="cell dk" style="background-image:url('../assets/backgrounds/bg_liso_branco_gelo_1.jpg')"><span class="tag">LISO · GELO</span></div>
  <div class="cell dk" style="background-image:url('../assets/backgrounds/bg_liso_cinza_gelo_1.jpg')"><span class="tag">LISO · CINZA</span></div>
</div>
</body></html>
