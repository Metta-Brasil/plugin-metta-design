<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:baseline;gap:14px}
  .row .tag{font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#435965;min-width:160px}
  .spec{flex:1}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="card">
  <div class="title">Body · Regular 100%</div>
  <div class="row"><span class="tag">Semibold 650</span><span class="spec" style="font-weight:650;font-stretch:100%;font-size:18px;line-height:1.35">Resultado com leveza é método</span></div>
  <div class="row"><span class="tag">Medium+ 590</span><span class="spec" style="font-weight:590;font-stretch:100%;font-size:17px;line-height:1.35">Pressionar além do limite gera picos e vales.</span></div>
  <div class="row"><span class="tag">Medium 510</span><span class="spec" style="font-weight:510;font-stretch:100%;font-size:16px;line-height:1.45">Processos que transformam incerteza em consistência.</span></div>
  <div class="row"><span class="tag">Book 400</span><span class="spec" style="font-weight:400;font-stretch:100%;font-size:15px;line-height:1.55;color:#435965">Cada decisão tem dado, diagnóstico e comportamento humano por trás.</span></div>
  <div class="row"><span class="tag">Light 270</span><span class="spec" style="font-weight:270;font-stretch:100%;font-size:15px;line-height:1.55;color:#688594">mentoria · estratégia · método</span></div>
</div>
</body></html>
