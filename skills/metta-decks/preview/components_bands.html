<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .wrap{padding:0;display:flex;flex-direction:column;gap:0}
  .band{height:6px;background:#FFBE18}
  .band-thick{height:48px;background:#FFBE18;display:flex;align-items:center;justify-content:center;gap:24px;color:#0C161B;font-weight:540;font-stretch:132%;letter-spacing:.22em;font-size:12px;text-transform:uppercase}
  .pad{padding:14px 22px;font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
  .trans{background:#FFBE18;color:#0C161B;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:650;font-stretch:132%;letter-spacing:.02em;font-size:15px}
  .trans-dark{background:#0C161B;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:650;font-stretch:132%;letter-spacing:.02em;font-size:15px}
  .trans .ar{color:#0C161B;font-weight:870;font-stretch:132%}
</style></head>
<body>
<div class="wrap">
  <div class="pad">Yellow band · 6px</div>
  <div class="band"></div>
  <div class="pad">Thick band — section separator</div>
  <div class="band-thick">MÉTODO · PROCESSO · RESULTADO</div>
  <div class="pad">Transition — yellow</div>
  <div class="trans"><span>CAPÍTULO SEGUINTE</span><span class="ar">05 →</span></div>
  <div class="trans-dark"><span>CAPÍTULO SEGUINTE</span><span style="color:#FFBE18">05 →</span></div>
</div>
</body></html>
