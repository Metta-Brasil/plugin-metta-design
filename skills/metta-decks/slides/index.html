<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Metta · Deck</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#000;color:#fff;font-family:'SF Pro','Roboto Flex',sans-serif}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="deck-stage.js"></script>
</head>
<body>
<deck-stage id="deck"></deck-stage>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const total = 7;
const Deck = () => (
  <>
    <TitleSlide
      kicker="Pitch comercial · v2026"
      title={<><span style={{color:'#FFBE18'}}>Bater meta</span><br/>virou método.</>}
      subtitle="Inteligência comercial aplicada. Garantia contratual. Onde o CNPJ cresce sem que o CPF pague o preço."
      num={1} total={total}/>
    <SectionSlide chapter="01" title="Posicionamento." num={2} total={total}/>
    <BigStatSlide
      kicker="O número"
      stat="R$ 8,5 bi"
      label="em receita atribuível para 1.000+ empresas em 21 anos."
      body="Não é teoria de palco. É método aplicado, auditável, que continua rodando depois da gente sair."
      num={3} total={total}/>
    <ComparisonSlide
      kicker="O método · três pilares"
      title={<>Diagnóstico, protocolo<br/>e <span style={{color:'#FFBE18'}}>garantia.</span></>}
      columns={[
        { num: '01', title: 'Diagnóstico', body: 'FCA — Fatos, Causas, Ações. Mapeamos o gap entre meta e execução em até 14 dias.' },
        { num: '02', title: 'Protocolo', body: 'Implementação assistida: rituais, scripts, painéis e cadências de revisão dentro da empresa.', highlight: true },
        { num: '03', title: 'Garantia', body: 'Bateu meta no ciclo contratado, ou devolvemos o investimento. Cláusula em contrato.' },
      ]}
      num={4} total={total}/>
    <ListSlide
      kicker="Princípios de execução"
      title={<>Método<br/>substitui<br/>improviso.</>}
      items={[
        { t: 'Decisão é dado, não opinião.', b: 'Toda meta tem leitura de pipeline antes de virar reunião.' },
        { t: 'Cadência é maior que motivação.', b: 'Ritual semanal de revisão que o time mantém quando saímos.' },
        { t: 'Garantia é contrato.', b: 'Não é promessa de palco — é cláusula com critério objetivo.' },
        { t: 'O CPF não paga o preço.', b: 'A receita do CNPJ não pode vir do esgotamento de pessoas.' },
      ]}
      num={5} total={total}/>
    <QuoteSlide
      quote="Em quatro meses passamos de meta batida no susto para meta batida com previsibilidade. O método ficou na empresa."
      attribution="Renata Maia"
      role="CEO · Grupo 7"
      num={6} total={total}/>
    <ClosingSlide
      contact={[
        { l: 'Sessão estratégica', v: 'metta.com.br/agendar' },
        { l: 'Direto', v: 'tiago@metta.com.br' },
      ]}
      num={7} total={total}/>
  </>
);
ReactDOM.createRoot(document.getElementById('deck')).render(<Deck/>);
</script>
</body>
</html>
