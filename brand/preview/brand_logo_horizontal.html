<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:2px}
  .cell{aspect-ratio:1/.55;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
  .cell img{max-width:72%;max-height:72%;display:block}
  .cell .tag{position:absolute;top:10px;left:12px;font-weight:540;font-stretch:132%;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .dark{background:#0C161B;color:#fff}
  .white{background:#FFFFFF}
  .yellow{background:#FFBE18;color:#0C161B}
  .ice{background:#EBF3F7}
</style></head>
<body>
<div class="wrap">
  <div class="cell dark"><span class="tag">ON DARK</span><img src="../assets/logos/logo_metta_colorido_h.svg" alt=""></div>
  <div class="cell white"><span class="tag">ON LIGHT</span><img src="../assets/logos/logo_metta_colorido_escuro_h.svg" alt=""></div>
  <div class="cell yellow"><span class="tag">ON YELLOW</span><img src="../assets/logos/logo_metta_azul_h.svg" alt=""></div>
  <div class="cell ice"><span class="tag">ON ICE · CINZA</span><img src="../assets/logos/logo_metta_cinza_h.svg" alt=""></div>
</div>
</body></html>
