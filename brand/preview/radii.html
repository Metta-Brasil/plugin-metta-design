<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .card{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:14px;align-items:flex-end;justify-content:space-between}
  .spec{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{width:78px;height:50px;background:#0C161B;border:1px solid rgba(12,22,27,.08)}
  .lb{font-weight:540;font-stretch:132%;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#435965}
  .val{font-size:10px;color:#688594;font-variant-numeric:tabular-nums}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="card">
  <div class="title">Radii</div>
  <div class="row">
    <div class="spec"><div class="box" style="border-radius:4px"></div><span class="lb">xs</span><span class="val">4px</span></div>
    <div class="spec"><div class="box" style="border-radius:8px"></div><span class="lb">sm</span><span class="val">8px</span></div>
    <div class="spec"><div class="box" style="border-radius:12px"></div><span class="lb">md</span><span class="val">12px</span></div>
    <div class="spec"><div class="box" style="border-radius:20px"></div><span class="lb">lg · cards</span><span class="val">20px</span></div>
    <div class="spec"><div class="box" style="border-radius:24px"></div><span class="lb">xl</span><span class="val">24px</span></div>
    <div class="spec"><div class="box" style="width:92px;border-radius:999px"></div><span class="lb">pill · CTA</span><span class="val">999px</span></div>
  </div>
</div>
</body></html>
