<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .sw{flex:1;min-width:0;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:72px;border:1px solid rgba(12,22,27,.08);color:#fff}
  .sw .n{font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .sw .h{font-weight:400;font-size:10px;opacity:.75;font-variant-numeric:tabular-nums}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="card">
  <div class="title">Suporte · Azul Acinzentado</div>
  <div class="row">
    <div class="sw" style="background:#435965"><span class="n">Azul Acinzentado</span><span class="h">#435965</span></div>
    <div class="sw" style="background:#688594"><span class="n">Claro</span><span class="h">#688594</span></div>
    <div class="sw" style="background:#75919F"><span class="n">Suave</span><span class="h">#75919F</span></div>
  </div>
</div>
</body></html>
