<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0C161B;color:#fff}
  .wrap{padding:22px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .b{display:inline-flex;align-items:center;padding:6px 14px;border-radius:40px;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-stretch:132%}
  /* Regra: borda = texto · sem fundos com baixa opacidade */
  .b-yellow{background:#FFBE18;color:#0C161B}
  .b-dark-on-yellow{background:#0C161B;color:#FFBE18}
  .b-outline-white{border:1px solid #fff;color:#fff}
  .b-outline-yellow{border:1px solid #FFBE18;color:#FFBE18}
  .b-ice{background:#FAFCFD;color:#0C161B}
  .b-support{background:#435965;color:#fff}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FFBE18}
  .chap{display:flex;align-items:center;gap:14px}
  .num{font-weight:870;font-stretch:132%;font-size:34px;color:#FFBE18;line-height:1}
</style></head>
<body>
<div class="wrap">
  <div class="title">Badges · value tags · chapter marks</div>
  <div class="row">
    <span class="b b-yellow">RESULTADO COM LEVEZA</span>
    <span class="b b-outline-white">PARCERIA NA EXECUÇÃO</span>
    <span class="b b-outline-yellow">CIÊNCIA COMO BASE</span>
  </div>
  <div class="row">
    <span class="b b-dark-on-yellow">ELITE</span>
    <span class="b b-support">MARCA PESSOAL</span>
    <span class="b b-ice">COMPROMETIMENTO TOTAL</span>
  </div>
  <div class="chap"><span class="num">04</span><div><div class="title" style="color:#688594;font-size:10px">CAPÍTULO 04</div><div style="font-weight:650;font-stretch:132%;font-size:16px;letter-spacing:-.01em">Nossos <span style="color:#FFBE18">valores</span></div></div></div>
</div>
</body></html>
