<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
  .sw{flex:1;min-width:0;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:72px;border:1px solid rgba(12,22,27,.08)}
  .sw .n{font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .sw .h{font-weight:400;font-size:10px;opacity:.55;font-variant-numeric:tabular-nums}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="card">
  <div class="title">Neutras · Branco & Gelo</div>
  <div class="row">
    <div class="sw" style="background:#FFFFFF"><span class="n">Branco</span><span class="h">#FFFFFF</span></div>
    <div class="sw" style="background:#FAFCFD"><span class="n">Branco Gelo</span><span class="h">#FAFCFD</span></div>
    <div class="sw" style="background:#EBF3F7"><span class="n">Gelo Azulado</span><span class="h">#EBF3F7</span></div>
    <div class="sw" style="background:#EFF3F5"><span class="n">Cinza Muito Claro</span><span class="h">#EFF3F5</span></div>
  </div>
</div>
</body></html>
