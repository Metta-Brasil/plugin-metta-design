<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0C161B;color:#fff}
  .card{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .block{display:flex;align-items:center;gap:16px}
  .lb{font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#FFBE18;min-width:130px}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FFBE18}
  .chip{background:#FFBE18;color:#0C161B;padding:6px 14px;border-radius:999px;display:inline-block}
</style></head>
<body>
<div class="card">
  <div class="title">Labels & tags</div>
  <div class="block"><span class="lb">Label L 14/.10</span><span style="font-weight:540;font-stretch:132%;font-size:14px;letter-spacing:.10em;text-transform:uppercase">CAPÍTULO 04 · NOSSOS VALORES</span></div>
  <div class="block"><span class="lb">Label S 12/.12</span><span class="chip" style="font-weight:540;font-stretch:132%;font-size:12px;letter-spacing:.12em;text-transform:uppercase">ELITE · MENTORIA</span></div>
  <div class="block"><span class="lb">Editorial 11/.28</span><span style="font-weight:270;font-stretch:132%;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#688594">PLAYBOOK DE CULTURA</span></div>
  <div class="block"><span class="lb">CTA · Bold 700</span><span class="chip" style="font-weight:700;font-stretch:132%;font-size:14px;letter-spacing:.01em;text-transform:uppercase">QUERO PARTICIPAR</span></div>
</div>
</body></html>
