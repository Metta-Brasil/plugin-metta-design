<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:14px}
  .bar{height:10px;border-radius:3px;background:#FFBE18}
  .lbl{font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#435965;min-width:56px}
  .val{font-size:10.5px;color:#688594;font-variant-numeric:tabular-nums;min-width:42px}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="card">
  <div class="title">Spacing · 4px base</div>
  <div class="row"><span class="lbl">1</span><span class="val">4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lbl">2</span><span class="val">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lbl">3</span><span class="val">12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lbl">4</span><span class="val">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lbl">5</span><span class="val">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lbl">6</span><span class="val">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lbl">7</span><span class="val">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lbl">8</span><span class="val">64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="lbl">9</span><span class="val">96px</span><div class="bar" style="width:96px"></div></div>
</div>
</body></html>
