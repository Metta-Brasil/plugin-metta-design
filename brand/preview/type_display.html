<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0C161B;color:#fff}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:baseline;gap:14px}
  .row .tag{font-weight:540;font-stretch:132%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#FFBE18;min-width:150px}
  .row .meta{font-size:10.5px;color:#688594;font-variant-numeric:tabular-nums}
  .spec{flex:1}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FFBE18}
</style></head>
<body>
<div class="card">
  <div class="title">Display · Expanded 132%</div>
  <div class="row"><span class="tag">Heavy 870</span><span class="spec" style="font-weight:870;font-stretch:132%;font-size:38px;line-height:.9;letter-spacing:-.01em">Bora bater meta</span></div>
  <div class="row"><span class="tag">Semibold 650</span><span class="spec" style="font-weight:650;font-stretch:132%;font-size:32px;line-height:.95;letter-spacing:-.01em">Inteligência comercial</span></div>
  <div class="row"><span class="tag">Regular 410</span><span class="spec" style="font-weight:410;font-stretch:132%;font-size:28px;line-height:1;letter-spacing:-.01em">Onde o CNPJ cresce</span></div>
  <div class="row"><span class="tag">Light 270</span><span class="spec" style="font-weight:270;font-stretch:132%;font-size:24px;line-height:1.1;letter-spacing:-.01em">sem que o CPF pague o preço.</span></div>
</div>
</body></html>
