<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#FAFCFD;color:#0C161B}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .sw{flex:1;min-width:0;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:86px;border:1px solid rgba(12,22,27,.08)}
  .sw .n{font-weight:540;font-stretch:132%;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
  .sw .h{font-weight:400;font-size:10.5px;opacity:.55;font-variant-numeric:tabular-nums}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#435965}
</style></head>
<body>
<div class="card">
  <div class="title">Base · Azul Noite</div>
  <div class="row">
    <div class="sw" style="background:#0C161B;color:#fff;border:none"><span class="n">Azul Noite</span><span class="h">#0C161B</span></div>
    <div class="sw" style="background:#0A1013;color:#fff;border:none"><span class="n">Azul Noite Profundo</span><span class="h">#0A1013</span></div>
    <div class="sw" style="background:#1A2A35;color:#fff;border:none"><span class="n">Dark Card</span><span class="h">#1A2A35</span></div>
    <div class="sw" style="background:#2E3E47;color:#fff;border:none"><span class="n">Dark Slate</span><span class="h">#2E3E47</span></div>
  </div>
</div>
</body></html>
