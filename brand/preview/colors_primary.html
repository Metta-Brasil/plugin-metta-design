<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0C161B;color:#fff}
  .card{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  .sw{flex:1;min-width:0;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:86px;border:1px solid rgba(255,255,255,.05)}
  .sw .n{font-weight:540;font-stretch:132%;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  .sw .h{font-weight:400;font-size:10.5px;opacity:.65;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .title{font-weight:540;font-stretch:132%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FFBE18}
</style></head>
<body>
<div class="card">
  <div class="title">Primária · Amarelo</div>
  <div class="row">
    <div class="sw" style="background:#FFBE18;color:#0C161B"><span class="n">Amarelo Principal</span><span class="h">#FFBE18</span></div>
    <div class="sw" style="background:#FFC531;color:#0C161B"><span class="n">Amarelo Claro</span><span class="h">#FFC531</span></div>
    <div class="sw" style="background:#FFCE50;color:#0C161B"><span class="n">Amarelo Médio</span><span class="h">#FFCE50</span></div>
    <div class="sw" style="background:#FFE4A1;color:#0C161B"><span class="n">Amarelo Suave</span><span class="h">#FFE4A1</span></div>
  </div>
</div>
</body></html>
